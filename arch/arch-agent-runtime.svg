<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 634" width="1000" height="634" role="img" aria-labelledby="ttl">
<title id="ttl">Agent runtime: one pod, profiles, automation, data and external dependencies</title>
<!--
  Architecture — layer 3: the agent runtime.
  Static, self-contained (internal styles only), no script, no remote asset.
  Update path: edit boxes here; keep every <text> inside its <g class="box"> rect
  (scripts/check_svg_labels.py asserts this).
-->
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e6e9ef}
  .ttl{font-size:13px;font-weight:700}
  .sub{font-size:9.5px;fill:#9aa3b5}
  .li{font-size:11px;fill:#c7cdd8}
  .cap{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#6ee7b7}
  .csub{font-size:9.5px;fill:#9aa3b5}
  .al{font-size:9.5px;fill:#9aa3b5;paint-order:stroke;stroke:#0f1115;stroke-width:3px;stroke-linejoin:round}
  .bx{stroke-width:1.4}
  .ext{fill:rgba(30,41,59,.6);stroke:#9aa3b5}
  .net{fill:rgba(8,51,68,.5);stroke:#9ec5ff}
  .git{fill:rgba(120,53,15,.35);stroke:#fbbf24}
  .sec{fill:rgba(136,19,55,.35);stroke:#fca5a5}
  .node{fill:rgba(6,78,59,.35);stroke:#34d399}
  .sto{fill:rgba(76,29,149,.35);stroke:#c4b5fd}
  .bnd{fill:rgba(6,78,59,.08);stroke:#34d399;stroke-width:1.2;stroke-dasharray:8 5}
  .ln{fill:none;stroke:#64748b;stroke-width:1.4}
  .ln.dash{stroke-dasharray:4 3}
</style>
<defs>
  <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
  </marker>
</defs>

<!-- edges first: they render behind the boxes -->
<path class="ln" d="M112,96 L112,184" marker-start="url(#arw)" marker-end="url(#arw)"/>
<path class="ln" d="M760,202 L525,202" marker-end="url(#arw)"/>
<path class="ln" d="M524,314 L760,328" marker-end="url(#arw)"/>
<path class="ln" d="M524,352 L760,408" marker-end="url(#arw)"/>
<path class="ln" d="M524,374 L760,488" marker-end="url(#arw)"/>
<!-- kubectl is a pod-level capability (namespaced service account), not a
     dispatcher feature: anchor it on the pod boundary -->
<path class="ln" d="M544,478 L760,578" marker-end="url(#arw)"/>

<text class="al" x="560" y="196">HTTP API</text>
<text class="al" x="616" y="318">LLM calls</text>
<text class="al" x="620" y="374">MCP calls</text>
<text class="al" x="616" y="425">web-extract</text>
<text class="al" x="620" y="506">kubectl</text>

<!-- the pod -->
<rect class="bnd" x="24" y="120" width="520" height="494" rx="10"/>
<text class="cap" x="300" y="142">AGENT RUNTIME &#183; ONE POD</text>
<text class="csub" x="40" y="159">one image &#183; a metrics sidecar &#183; a UI bridge sidecar</text>

<!-- 1. ingress -->
<text class="cap" x="40" y="176">INGRESS</text>
<g class="box" data-box="discord-gateway">
  <rect class="bx net" x="40" y="184" width="150" height="70" rx="6"/>
  <text class="ttl" x="52" y="208">Chat gateway</text>
  <text class="sub" x="52" y="228">channels · messages</text>
</g>
<g class="box" data-box="dashboard">
  <rect class="bx net" x="207" y="184" width="150" height="70" rx="6"/>
  <text class="ttl" x="219" y="208">Dashboard</text>
  <text class="sub" x="219" y="228">dashboard</text>
</g>
<g class="box" data-box="api">
  <rect class="bx net" x="374" y="184" width="150" height="70" rx="6"/>
  <text class="ttl" x="386" y="208">HTTP API</text>
  <text class="sub" x="386" y="228">HTTP API</text>
</g>

<!-- 2. brain -->
<text class="cap" x="40" y="278">BRAIN</text>
<g class="box" data-box="orkestraattori">
  <rect class="bx node" x="40" y="286" width="200" height="88" rx="6"/>
  <text class="ttl" x="56" y="310">Orchestrator</text>
  <text class="sub" x="56" y="330">root profile routes</text>
  <text class="sub" x="56" y="348">routing · delegation</text>
</g>
<g class="box" data-box="profiilit">
  <rect class="bx node" x="257" y="286" width="267" height="88" rx="6"/>
  <text class="ttl" x="273" y="310">Profiles</text>
  <text class="li" x="273" y="332">architect · lead-coder · junior-coder</text>
  <text class="li" x="273" y="350">researcher · visual-creator</text>
  <text class="sub" x="273" y="366">one directory per profile</text>
</g>
<path class="ln" d="M240,330 L257,330" marker-end="url(#arw)"/>

<!-- 3. automation -->
<text class="cap" x="40" y="398">AUTOMATION</text>
<g class="box" data-box="cron">
  <rect class="bx git" x="40" y="406" width="233" height="64" rx="6"/>
  <text class="ttl" x="56" y="430">Scheduler</text>
  <text class="sub" x="56" y="450">schedules · job definitions</text>
</g>
<g class="box" data-box="dispatcher">
  <rect class="bx git" x="291" y="406" width="233" height="64" rx="6"/>
  <text class="ttl" x="307" y="430">Task dispatcher</text>
  <text class="sub" x="307" y="450">workers · worktrees</text>
</g>

<!-- 4. data -->
<text class="cap" x="40" y="494">DATA</text>
<g class="box" data-box="pvc-data">
  <rect class="bx sto" x="40" y="502" width="233" height="96" rx="6"/>
  <text class="ttl" x="56" y="526">data volume</text>
  <text class="sub" x="56" y="546">memory · facts</text>
  <text class="li" x="56" y="566">notes · skills</text>
  <text class="li" x="56" y="584">schedules · task DB</text>
</g>
<g class="box" data-box="pvc-workspace">
  <rect class="bx sto" x="291" y="502" width="233" height="96" rx="6"/>
  <text class="ttl" x="307" y="526">workspace volume</text>
  <text class="sub" x="307" y="546">repos · worktrees</text>
  <text class="li" x="307" y="566">checkouts · branches</text>
  <text class="li" x="307" y="584">the written why</text>
</g>

<!-- outside the pod -->
<g class="box" data-box="discord">
  <rect class="bx ext" x="24" y="32" width="176" height="64" rx="6"/>
  <text class="ttl" x="40" y="56">Chat</text>
  <text class="sub" x="40" y="76">operator · channels</text>
</g>
<g class="box" data-box="envoy">
  <rect class="bx ext" x="760" y="170" width="224" height="64" rx="6"/>
  <text class="ttl" x="776" y="194">Ingress gateway</text>
  <text class="sub" x="776" y="214">HTTPS routing</text>
</g>
<g class="box" data-box="llm">
  <rect class="bx ext" x="760" y="296" width="224" height="64" rx="6"/>
  <text class="ttl" x="776" y="320">LLM providers</text>
  <text class="sub" x="776" y="340">hosted models</text>
</g>
<g class="box" data-box="mcp">
  <rect class="bx ext" x="760" y="376" width="224" height="64" rx="6"/>
  <text class="ttl" x="776" y="400">Tool servers</text>
  <text class="sub" x="776" y="420">workflow · code · files</text>
</g>
<g class="box" data-box="Web extractor">
  <rect class="bx ext" x="760" y="456" width="224" height="64" rx="6"/>
  <text class="ttl" x="776" y="480">Web extractor</text>
  <text class="sub" x="776" y="500">web-extract</text>
</g>
<g class="box" data-box="k8s-api">
  <rect class="bx ext" x="760" y="540" width="224" height="76" rx="6"/>
  <text class="ttl" x="776" y="564">Kubernetes API</text>
  <text class="sub" x="776" y="584">namespaced service account</text>
  <text class="sub" x="776" y="600">namespaced RBAC</text>
</g>
</svg>

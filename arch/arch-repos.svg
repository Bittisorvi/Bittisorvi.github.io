<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="ttl">
<title id="ttl">Repositories and their relations: what each repo produces and where it lands</title>
<!--
  Architecture — layer 2: repository relations.
  Static, self-contained (internal styles only), no script, no remote asset.
  Update path: edit boxes here; keep every <text> inside its <g class="box"> rect
  (scripts/check_svg_labels.py asserts this).
-->
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e6e9ef}
  .ttl{font-size:13px;font-weight:700}
  .sub{font-size:9.5px;fill:#9aa3b5}
  .li{font-size:11px;fill:#c7cdd8}
  .cap{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#6ee7b7}
  .al{font-size:9.5px;fill:#9aa3b5;paint-order:stroke;stroke:#0f1115;stroke-width:3px;stroke-linejoin:round}
  .bx{stroke-width:1.4}
  .ext{fill:rgba(30,41,59,.6);stroke:#9aa3b5}
  .net{fill:rgba(8,51,68,.5);stroke:#9ec5ff}
  .git{fill:rgba(120,53,15,.35);stroke:#fbbf24}
  .sec{fill:rgba(136,19,55,.35);stroke:#fca5a5}
  .node{fill:rgba(6,78,59,.35);stroke:#34d399}
  .sto{fill:rgba(76,29,149,.35);stroke:#c4b5fd}
  .bnd{fill:rgba(6,78,59,.08);stroke:#34d399;stroke-width:1.2;stroke-dasharray:8 5}
  .ln{fill:none;stroke:#64748b;stroke-width:1.4}
  .ln.dash{stroke-dasharray:4 3}
</style>
<defs>
  <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
  </marker>
</defs>

<!-- edges first: they render behind the boxes -->
<path class="ln" d="M60,152 L60,450" marker-end="url(#arw)"/>
<path class="ln" d="M360,152 L360,482" marker-end="url(#arw)"/>
<path class="ln" d="M621,152 L621,200" marker-end="url(#arw)"/>
<path class="ln" d="M621,292 L621,330" marker-end="url(#arw)"/>
<path class="ln" d="M640,422 L640,482" marker-end="url(#arw)"/>
<path class="ln dash" d="M863,152 L863,200" marker-end="url(#arw)"/>

<text class="al" x="70" y="400">Ansible SSH · k3s install/upgrade</text>
<text class="al" x="368" y="232">git reconcile</text>
<text class="al" x="631" y="182">build.yml</text>
<text class="al" x="631" y="316">push</text>
<text class="al" x="648" y="440">image pull</text>
<text class="al" x="742" y="181">prompts/schemas (raw)</text>

<!-- top row: the four repos -->
<g class="box" data-box="machine repo">
  <rect class="bx ext" x="24" y="40" width="226" height="112" rx="6"/>
  <text class="ttl" x="40" y="64">machine repo</text>
  <text class="sub" x="40" y="84">Ansible + Taskfiles</text>
  <text class="sub" x="40" y="100">OS baseline · hardening</text>
  <text class="sub" x="40" y="116">k3s install/upgrade</text>
  <text class="sub" x="40" y="132">node labels</text>
</g>
<g class="box" data-box="deployment repo">
  <rect class="bx ext" x="266" y="40" width="226" height="112" rx="6"/>
  <text class="ttl" x="282" y="64">deployment repo</text>
  <text class="sub" x="282" y="84">Flux manifests</text>
  <text class="sub" x="282" y="100">apps · routes</text>
  <text class="sub" x="282" y="116">dashboards · alerts</text>
</g>
<g class="box" data-box="application repo">
  <rect class="bx ext" x="508" y="40" width="226" height="112" rx="6"/>
  <text class="ttl" x="524" y="64">application repo</text>
  <text class="sub" x="524" y="84">application code</text>
  <text class="sub" x="524" y="100">services</text>
  <text class="sub" x="524" y="116">CLIs</text>
</g>
<g class="box" data-box="homelab-workflows">
  <rect class="bx ext" x="750" y="40" width="226" height="112" rx="6"/>
  <text class="ttl" x="766" y="64">workflow-assets repo</text>
  <text class="sub" x="766" y="84">workflow prompts + schemas</text>
  <text class="sub" x="766" y="100">no runnable service</text>
  <text class="sub" x="766" y="116">CI: schema checks</text>
  <text class="sub" x="766" y="132">contract checks</text>
</g>

<!-- middle row: what the repos feed -->
<g class="box" data-box="gh-actions">
  <rect class="bx ext" x="508" y="200" width="226" height="92" rx="6"/>
  <text class="ttl" x="524" y="224">GitHub Actions</text>
  <text class="sub" x="524" y="244">build.yml</text>
  <text class="sub" x="524" y="260">→ registry (tag = run_id)</text>
</g>
<g class="box" data-box="workflow-engine">
  <rect class="bx net" x="750" y="200" width="226" height="92" rx="6"/>
  <text class="ttl" x="766" y="224">Workflow engine</text>
  <text class="sub" x="766" y="244">prompts + schemas</text>
  <text class="sub" x="766" y="260">fetched at run time</text>
  <text class="sub" x="766" y="276"></text>
</g>

<g class="box" data-box="registry">
  <rect class="bx ext" x="430" y="330" width="320" height="92" rx="6"/>
  <text class="ttl" x="446" y="354">registry</text>
  <text class="sub" x="446" y="374">registry / application repo</text>
  <text class="sub" x="446" y="390">services</text>
  <text class="sub" x="446" y="406">tag = build id → pinned in the deployment repo</text>
</g>

<!-- bottom: the cluster, no node detail (that is layer 1) -->
<rect class="bnd" x="24" y="450" width="952" height="120" rx="10"/>
<text class="cap" x="44" y="471">K3S CLUSTER</text>

<g class="box" data-box="flux">
  <rect class="bx git" x="250" y="482" width="220" height="64" rx="6"/>
  <text class="ttl" x="266" y="508">Flux</text>
  <text class="sub" x="266" y="526">git reconcile</text>
</g>
<g class="box" data-box="tyokuormat">
  <rect class="bx node" x="520" y="482" width="430" height="64" rx="6"/>
  <text class="ttl" x="536" y="508">workloads</text>
  <text class="sub" x="536" y="526">services · workflows · agent runtime</text>
</g>
</svg>
